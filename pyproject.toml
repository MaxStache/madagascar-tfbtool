[project]
name = "madagascar-tfbtool"
version = "0.1.0"
description = "Parser and decompiler for TFB script (.ai) files used by Madagascar - The Game (2005)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    colorama==0.4.6
    fonttools==4.63.0
    iniconfig==2.3.0
    nodeenv==1.10.0
    packaging==26.2
    pillow==12.3.0
    pluggy==1.6.0
    Pygments==2.20.0
    pyright==1.1.411
    PySide6==6.11.1
    PySide6_Addons==6.11.1
    PySide6_Essentials==6.11.1
    pytest==9.1.1
    PyYAML==6.0.3
    ruff==0.16.0
    shiboken6==6.11.1
    typing_extensions==4.16.0
]

[project.scripts]
tfbtool = "tfbscript.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
