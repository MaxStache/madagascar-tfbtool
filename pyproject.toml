[project]
name = "madagascar-tfbtool"
version = "0.1.0"
description = "Parser and decompiler for TFB script (.ai) files used by Madagascar - The Game (2005)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "colorama==0.4.6",
    "fonttools==4.63.0",
    "nodeenv==1.10.0",
    "pillow==12.3.0",
    "PySide6==6.11.1",
    "PyYAML==6.0.3",
]

[project.scripts]
tfbtool = "tfbscript.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tfbscript"]